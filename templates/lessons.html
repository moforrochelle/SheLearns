{% extends "base.html" %}

{% block title %}Lessons{% endblock %}
{% block heading %}Lessons{% endblock %}

{% block content %}

  <p class="intro">Short lessons to read in your free time. Pick a topic.</p>

  {% for t in topics %}
    <a class="item" href="/lesson/{{ t.id }}">
      <span>{{ t.title }}</span>
      {% if t.id in saved %}<span class="badge">Ready</span>{% endif %}
    </a>
  {% endfor %}

  <a class="back" href="/">Back to home</a>

{% endblock %}
