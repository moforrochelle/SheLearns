<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review posts</title>
</head>
<body>
  <h1>Review posts</h1>

  {% for p in queue %}
    <div>
      <p><strong>{{ p.author }}</strong>
        <small>
          {% if p.status == "reported" %}(reported by a user){% else %}(new){% endif %}
        </small>
      </p>
      <p style="white-space: pre-wrap;">{{ p.text }}</p>
      <form method="post" action="/admin/decide/{{ p.id }}/approve" style="display:inline;">
        <button>Approve</button>
      </form>
      <form method="post" action="/admin/decide/{{ p.id }}/reject" style="display:inline;">
        <button>Reject</button>
      </form>
      <hr>
    </div>
  {% else %}
    <p>Nothing to review.</p>
  {% endfor %}

  <a href="/">Back</a>
</body>
</html>
